<!--
Program 2: Conduct exploratory data analysis and identify significant patterns using statistical and visualization techniques
=============================================================================================================================

Aim
---
To perform exploratory data analysis on the Mall Customers dataset and identify significant patterns using statistics and visualizations.

Dataset: Mall_Customers.csv (place it in the same folder as the notebook)

Procedure
---------
1. Import pandas, numpy, matplotlib and seaborn.
2. Load the Mall_Customers.csv dataset.
3. Check shape, info, missing values and duplicates.
4. Generate statistical summary using describe().
5. Plot distributions of Age, Annual Income and Spending Score.
6. Compare Gender using countplot and boxplot.
7. Compute correlation matrix and plot a heatmap.
8. Plot a pairplot to study relationships between numeric features.
9. Plot Income vs Spending Score scatter plot.
10. Print significant patterns such as group-wise averages and correlations.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {'pandas': 'pandas', 'numpy': 'numpy', 'matplotlib': 'matplotlib', 'seaborn': 'seaborn'}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

import pandas as pd
import numpy as np
import matplotlib.pyplot as plt
import seaborn as sns

sns.set_style("whitegrid")

df = pd.read_csv("Mall_Customers.csv")
display(df.head())

print("Shape:", df.shape)
print(df.info())
print("\nMissing values:\n", df.isnull().sum())
print("\nDuplicate rows:", df.duplicated().sum())

# Statistical summary
display(df.describe())

# Distribution of numeric features
fig, axes = plt.subplots(1, 3, figsize=(15, 4))
sns.histplot(df["Age"], kde=True, ax=axes[0])
axes[0].set_title("Age Distribution")
sns.histplot(df["Annual Income (k$)"], kde=True, ax=axes[1])
axes[1].set_title("Annual Income Distribution")
sns.histplot(df["Spending Score (1-100)"], kde=True, ax=axes[2])
axes[2].set_title("Spending Score Distribution")
plt.tight_layout()
plt.show()

# Gender-wise comparison
plt.figure(figsize=(6, 4))
sns.countplot(x="Gender", data=df)
plt.title("Customer Count by Gender")
plt.show()

plt.figure(figsize=(6, 4))
sns.boxplot(x="Gender", y="Spending Score (1-100)", data=df)
plt.title("Spending Score by Gender")
plt.show()

# Correlation among numeric features
num_df = df.drop("CustomerID", axis=1).select_dtypes(include=np.number)
corr = num_df.corr()
plt.figure(figsize=(6, 5))
sns.heatmap(corr, annot=True, cmap="coolwarm")
plt.title("Correlation Heatmap")
plt.show()
print(corr)

# Pairwise relationships between numeric features
sns.pairplot(df, vars=["Age", "Annual Income (k$)", "Spending Score (1-100)"], hue="Gender")
plt.show()

# Income vs Spending Score scatter plot
plt.figure(figsize=(7, 5))
sns.scatterplot(x="Annual Income (k$)", y="Spending Score (1-100)", hue="Gender", data=df)
plt.title("Annual Income vs Spending Score")
plt.show()

# Significant patterns observed
print("Average spending score by gender:")
print(df.groupby("Gender")["Spending Score (1-100)"].mean())

print("\nCorrelation between Annual Income and Spending Score:",
      round(corr.loc["Annual Income (k$)", "Spending Score (1-100)"], 3))
