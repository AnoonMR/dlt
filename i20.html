<!--
Program 2: Implementing Tokenization and Text Normalization
===========================================================

Aim
---
To tokenize a given text and normalize it using lowercasing, stopword removal, stemming, and lemmatization.

Procedure
---------
1. Import NLTK modules for tokenization and normalization.
2. Take a sample paragraph as input.
3. Split the text into sentences using sentence tokenizer.
4. Split the text into words using word tokenizer.
5. Convert all tokens to lowercase.
6. Remove punctuation marks from the tokens.
7. Remove stopwords using NLTK's stopword list.
8. Apply stemming using the Porter Stemmer.
9. Apply lemmatization using WordNet Lemmatizer.
10. Display results after each normalization step.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {'nltk': 'nltk'}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

import nltk
nltk.download('punkt')
nltk.download('punkt_tab')
nltk.download('averaged_perceptron_tagger')
nltk.download('averaged_perceptron_tagger_eng')
nltk.download('maxent_ne_chunker')
nltk.download('maxent_ne_chunker_tab')
nltk.download('words')
nltk.download('stopwords')
nltk.download('wordnet')
nltk.download('brown')

import string
from nltk.tokenize import word_tokenize, sent_tokenize
from nltk.corpus import stopwords
from nltk.stem import PorterStemmer, WordNetLemmatizer

text = "NLP is amazing! It's transforming how machines understand human languages, isn't it?"

sentences = sent_tokenize(text)
words = word_tokenize(text)
print("Sentences:", sentences)
print("Words:", words)

lower_words = [w.lower() for w in words]
no_punct = [w for w in lower_words if w not in string.punctuation]
stop_words = set(stopwords.words('english'))
no_stopwords = [w for w in no_punct if w not in stop_words]

ps = PorterStemmer()
stemmed = [ps.stem(w) for w in no_stopwords]

lemmatizer = WordNetLemmatizer()
lemmatized = [lemmatizer.lemmatize(w) for w in no_stopwords]

print("\nLowercased:", lower_words)
print("Without punctuation:", no_punct)
print("Without stopwords:", no_stopwords)
print("Stemmed:", stemmed)
print("Lemmatized:", lemmatized)
