Program 2 (medium): Implementing Tokenization and Text Normalization
====================================================================

Aim
---
To tokenize a given text and normalize it using lowercasing, stopword removal, stemming, and lemmatization.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {'nltk': 'nltk'}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

import nltk
for pkg in ['punkt', 'punkt_tab', 'stopwords', 'wordnet']:
    nltk.download(pkg)

import string
from nltk.tokenize import word_tokenize, sent_tokenize
from nltk.corpus import stopwords
from nltk.stem import PorterStemmer, WordNetLemmatizer

text = "NLP is amazing! It's transforming how machines understand human languages, isn't it?"

# Tokenization
print("Sentences:", sent_tokenize(text))
words = word_tokenize(text)
print("Words:", words)

# Lowercasing and punctuation removal
lower = [w.lower() for w in words]
no_punct = [w for w in lower if w not in string.punctuation]
print("Lowercased (no punctuation):", no_punct)

# Stopword removal
stop_words = set(stopwords.words('english'))
no_stop = [w for w in no_punct if w not in stop_words]
print("Without stopwords:", no_stop)

# Stemming vs Lemmatization
ps, lemmatizer = PorterStemmer(), WordNetLemmatizer()
print(f"\n{'Word':14s}{'Stem':12s}Lemma")
for w in no_stop:
    print(f"{w:14s}{ps.stem(w):12s}{lemmatizer.lemmatize(w)}")
