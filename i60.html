<!--
Program 6: POS Tagging using HMM and Viterbi Algorithm
======================================================

Aim
---
To implement a Hidden Markov Model (HMM) based POS tagger and decode the most likely tag sequence using the Viterbi algorithm.

Procedure
---------
1. Load POS-tagged corpus and split into train/test sets.
2. Count tag transitions and word emissions from training data.
3. Compute transition and emission probabilities (add-1 smoothing).
4. Apply Viterbi algorithm to decode best tag sequence.
5. Compare predicted tags with true tags and find accuracy.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {'nltk': 'nltk'}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

import nltk
nltk.download('treebank')

from nltk.corpus import treebank
from collections import defaultdict

# Load POS-tagged sentences and split into train/test
tagged_sents = treebank.tagged_sents()
split = int(0.9 * len(tagged_sents))
train_sents = tagged_sents[:split]
test_sents = tagged_sents[split:]

print("Train sentences:", len(train_sents))
print("Test sentences:", len(test_sents))

# Collect the tag set and vocabulary, then count transitions and emissions
tags = set()
words = set()
for sent in train_sents:
    for w, t in sent:
        tags.add(t)
        words.add(w.lower())
tags = sorted(tags)

transition_counts = defaultdict(lambda: defaultdict(int))
tag_counts = defaultdict(int)
emission_counts = defaultdict(lambda: defaultdict(int))

for sent in train_sents:
    prev_tag = '<s>'
    for w, t in sent:
        transition_counts[prev_tag][t] += 1
        emission_counts[t][w.lower()] += 1
        tag_counts[t] += 1
        prev_tag = t
    transition_counts[prev_tag]['</s>'] += 1

print("Number of tags:", len(tags))
print("Vocabulary size:", len(words))

def trans_prob(t1, t2):
    """P(t2 | t1) with Laplace (add-1) smoothing."""
    total = sum(transition_counts[t1].values())
    return (transition_counts[t1][t2] + 1) / (total + len(tags) + 1)


def emit_prob(t, w):
    """P(w | t) with Laplace (add-1) smoothing."""
    total = tag_counts[t]
    return (emission_counts[t][w] + 1) / (total + len(words))

def viterbi(sentence):
    """Decode the most likely tag sequence for `sentence` using the Viterbi algorithm."""
    words_seq = [w.lower() for w in sentence]
    n = len(words_seq)
    V = [{} for _ in range(n)]
    backpointer = [{} for _ in range(n)]

    # Initialization step
    for t in tags:
        V[0][t] = trans_prob('<s>', t) * emit_prob(t, words_seq[0])
        backpointer[0][t] = '<s>'

    # Recursion step
    for i in range(1, n):
        for t in tags:
            max_prob, best_prev = max(
                (V[i - 1][pt] * trans_prob(pt, t) * emit_prob(t, words_seq[i]), pt)
                for pt in tags
            )
            V[i][t] = max_prob
            backpointer[i][t] = best_prev

    # Termination: backtrack through the backpointers
    best_last_tag = max(tags, key=lambda t: V[n - 1][t])
    best_path = [best_last_tag]
    for i in range(n - 1, 0, -1):
        best_path.insert(0, backpointer[i][best_path[0]])

    return list(zip(sentence, best_path))

# Test the tagger on a held-out sentence and compare against the true tags
test_sentence = [w for w, t in test_sents[0]]
true_tags = [t for w, t in test_sents[0]]
predicted = viterbi(test_sentence)

print("Sentence:", ' '.join(test_sentence))

print("\nWord            Predicted   True")
correct = 0
for (w, pt), tt in zip(predicted, true_tags):
    print(f"{w:15} {pt:10}  {tt}")
    if pt == tt:
        correct += 1

print(f"\nAccuracy on this sentence: {correct}/{len(true_tags)} = {correct / len(true_tags) * 100:.2f}%")
