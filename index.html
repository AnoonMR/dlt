Program 3: Implementing Edit Distance and Weighted Edit Distance
================================================================

Aim
---
To compute the Edit Distance and Weighted Edit Distance between two given strings using dynamic programming.

Procedure
---------
1. Take two input strings/words.
2. Create a DP table of size (m+1) x (n+1).
3. Initialize first row and column with index values (base costs).
4. Fill the table: if characters match, copy diagonal value.
5. If characters differ, take min of insert, delete, substitute
6. operations (+1 each for simple edit distance).
7. For weighted edit distance, use custom costs for insertion,
8. deletion, and substitution instead of uniform cost 1.
9. Return the value in the last cell as the edit distance.
10. Display both simple and weighted edit distance results.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

def edit_distance(s1, s2):
    """Levenshtein (unweighted) edit distance using dynamic programming."""
    m, n = len(s1), len(s2)
    dp = [[0] * (n + 1) for _ in range(m + 1)]

    for i in range(m + 1):
        dp[i][0] = i
    for j in range(n + 1):
        dp[0][j] = j

    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if s1[i - 1] == s2[j - 1]:
                dp[i][j] = dp[i - 1][j - 1]
            else:
                dp[i][j] = 1 + min(dp[i - 1][j],      # deletion
                                    dp[i][j - 1],      # insertion
                                    dp[i - 1][j - 1])  # substitution
    return dp[m][n]


def weighted_edit_distance(s1, s2, ins_cost=1, del_cost=1, sub_cost=2):
    """Edit distance with custom insertion/deletion/substitution costs."""
    m, n = len(s1), len(s2)
    dp = [[0] * (n + 1) for _ in range(m + 1)]

    for i in range(m + 1):
        dp[i][0] = i * del_cost
    for j in range(n + 1):
        dp[0][j] = j * ins_cost

    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if s1[i - 1] == s2[j - 1]:
                dp[i][j] = dp[i - 1][j - 1]
            else:
                dp[i][j] = min(dp[i - 1][j] + del_cost,
                                dp[i][j - 1] + ins_cost,
                                dp[i - 1][j - 1] + sub_cost)
    return dp[m][n]


word1, word2 = "intention", "execution"
print(f"Edit Distance between '{word1}' and '{word2}': {edit_distance(word1, word2)}")
print(f"Weighted Edit Distance between '{word1}' and '{word2}': "
      f"{weighted_edit_distance(word1, word2)}")



Program 4: Noisy Channel Model for Spelling Correction
======================================================

Aim
---
To implement a spelling correction system based on the Noisy Channel Model using edit distance and word frequency.

Procedure
---------
1. Build word frequencies from a corpus (language model).
2. Generate candidate words within edit distance 1-2 (channel model).
3. Keep only valid dictionary candidates.
4. Pick the candidate with highest P(word).
5. Test on misspelled words and display corrections.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {'nltk': 'nltk'}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

import nltk
nltk.download('brown')

from collections import Counter
from nltk.corpus import brown

# Language model: real word-frequency counts built from the Brown corpus
# (a plain word list like nltk.corpus.words has no frequency info, so
# using a running-text corpus gives far better corrections)
WORDS = Counter(w.lower() for w in brown.words())


def P(word, N=sum(WORDS.values())):
    """Probability of `word` (language model term of the noisy channel)."""
    return WORDS[word] / N


def edits1(word):
    """All strings that are one edit away from `word` (channel model)."""
    letters = 'abcdefghijklmnopqrstuvwxyz'
    splits = [(word[:i], word[i:]) for i in range(len(word) + 1)]
    deletes = [L + R[1:] for L, R in splits if R]
    transposes = [L + R[1] + R[0] + R[2:] for L, R in splits if len(R) > 1]
    replaces = [L + c + R[1:] for L, R in splits if R for c in letters]
    inserts = [L + c + R for L, R in splits for c in letters]
    return set(deletes + transposes + replaces + inserts)


def edits2(word):
    """All strings that are two edits away from `word`."""
    return set(e2 for e1 in edits1(word) for e2 in edits1(e1))


def known(word_list):
    """Subset of `word_list` that appear in the dictionary."""
    return set(w for w in word_list if w in WORDS)


def candidates(word):
    """Generate possible spelling correction candidates for word."""
    return known([word]) or known(edits1(word)) or known(edits2(word)) or [word]


def correction(word):
    """Most probable spelling correction for word (argmax P(word) among candidates)."""
    return max(candidates(word), key=P)


test_words = ["speling", "korrect", "recieve", "wrld"]
for w in test_words:
    print(f"'{w}' -> '{correction(w)}'")



Program 5: N-Gram Model Implementation and Evaluation Insights
==============================================================

Aim
---
To implement a bigram language model with add-1 smoothing and evaluate it using sentence probability and perplexity.

Procedure
---------
1. Load corpus and split into train/test sentences.
2. Count bigram frequencies from training data.
3. Compute bigram probability with add-1 smoothing.
4. Evaluate test sentence: probability and perplexity.
5. Generate text using the trained bigram model.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {'nltk': 'nltk'}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

import nltk
nltk.download('brown')
nltk.download('punkt')
nltk.download('punkt_tab')

from nltk.corpus import brown
from nltk import bigrams, ConditionalFreqDist
import math
import random

# Load a corpus and split into train/test sentences
sentences = brown.sents(categories='news')
split = int(0.8 * len(sentences))
train_sents = sentences[:split]
test_sents = sentences[split:]

print("Total sentences:", len(sentences))
print("Train sentences:", len(train_sents))
print("Test sentences:", len(test_sents))

# Build bigram counts and vocabulary from the training data
cfd = ConditionalFreqDist()
vocab = set()

for sent in train_sents:
    tokens = ['<s>'] + [w.lower() for w in sent] + ['</s>']
    vocab.update(tokens)
    for w1, w2 in bigrams(tokens):
        cfd[w1][w2] += 1

V = len(vocab)
print("Vocabulary size:", V)

def bigram_prob(w1, w2):
    """P(w2 | w1) with Laplace (add-1) smoothing."""
    return (cfd[w1][w2] + 1) / (sum(cfd[w1].values()) + V)


def sentence_probability(sentence):
    """Probability of a sentence under the bigram model."""
    tokens = ['<s>'] + [w.lower() for w in sentence] + ['</s>']
    prob = 1.0
    for w1, w2 in bigrams(tokens):
        prob *= bigram_prob(w1, w2)
    return prob


def perplexity(sentence):
    """Perplexity of a sentence under the bigram model (lower = better fit)."""
    tokens = ['<s>'] + [w.lower() for w in sentence] + ['</s>']
    n = len(tokens) - 1
    log_prob_sum = sum(math.log(bigram_prob(w1, w2)) for w1, w2 in bigrams(tokens))
    return math.exp(-log_prob_sum / n)

# Evaluate the model on a sentence from the held-out test set
test_sentence = test_sents[0]
print("Test sentence:", ' '.join(test_sentence))
print("Bigram probability:", sentence_probability(test_sentence))
print("Perplexity:", perplexity(test_sentence))

def generate_text(start_word='the', num_words=15):
    """Greedily generate text by always picking the most likely next word."""
    result = [start_word]
    word = start_word
    for _ in range(num_words):
        next_words = cfd[word]
        if not next_words:
            break
        word = next_words.max()
        if word == '</s>':
            break
        result.append(word)
    return ' '.join(result)


print("Generated text:", generate_text())



Program 6: POS Tagging using HMM and Viterbi Algorithm
======================================================

Aim
---
To implement a Hidden Markov Model (HMM) based POS tagger and decode the most likely tag sequence using the Viterbi algorithm.

Procedure
---------
1. Load POS-tagged corpus and split into train/test sets.
2. Count tag transitions and word emissions from training data.
3. Compute transition and emission probabilities (add-1 smoothing).
4. Apply Viterbi algorithm to decode best tag sequence.
5. Compare predicted tags with true tags and find accuracy.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {'nltk': 'nltk'}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

import nltk
nltk.download('treebank')

from nltk.corpus import treebank
from collections import defaultdict

# Load POS-tagged sentences and split into train/test
tagged_sents = treebank.tagged_sents()
split = int(0.9 * len(tagged_sents))
train_sents = tagged_sents[:split]
test_sents = tagged_sents[split:]

print("Train sentences:", len(train_sents))
print("Test sentences:", len(test_sents))

# Collect the tag set and vocabulary, then count transitions and emissions
tags = set()
words = set()
for sent in train_sents:
    for w, t in sent:
        tags.add(t)
        words.add(w.lower())
tags = sorted(tags)

transition_counts = defaultdict(lambda: defaultdict(int))
tag_counts = defaultdict(int)
emission_counts = defaultdict(lambda: defaultdict(int))

for sent in train_sents:
    prev_tag = '<s>'
    for w, t in sent:
        transition_counts[prev_tag][t] += 1
        emission_counts[t][w.lower()] += 1
        tag_counts[t] += 1
        prev_tag = t
    transition_counts[prev_tag]['</s>'] += 1

print("Number of tags:", len(tags))
print("Vocabulary size:", len(words))

def trans_prob(t1, t2):
    """P(t2 | t1) with Laplace (add-1) smoothing."""
    total = sum(transition_counts[t1].values())
    return (transition_counts[t1][t2] + 1) / (total + len(tags) + 1)


def emit_prob(t, w):
    """P(w | t) with Laplace (add-1) smoothing."""
    total = tag_counts[t]
    return (emission_counts[t][w] + 1) / (total + len(words))

def viterbi(sentence):
    """Decode the most likely tag sequence for `sentence` using the Viterbi algorithm."""
    words_seq = [w.lower() for w in sentence]
    n = len(words_seq)
    V = [{} for _ in range(n)]
    backpointer = [{} for _ in range(n)]

    # Initialization step
    for t in tags:
        V[0][t] = trans_prob('<s>', t) * emit_prob(t, words_seq[0])
        backpointer[0][t] = '<s>'

    # Recursion step
    for i in range(1, n):
        for t in tags:
            max_prob, best_prev = max(
                (V[i - 1][pt] * trans_prob(pt, t) * emit_prob(t, words_seq[i]), pt)
                for pt in tags
            )
            V[i][t] = max_prob
            backpointer[i][t] = best_prev

    # Termination: backtrack through the backpointers
    best_last_tag = max(tags, key=lambda t: V[n - 1][t])
    best_path = [best_last_tag]
    for i in range(n - 1, 0, -1):
        best_path.insert(0, backpointer[i][best_path[0]])

    return list(zip(sentence, best_path))

# Test the tagger on a held-out sentence and compare against the true tags
test_sentence = [w for w, t in test_sents[0]]
true_tags = [t for w, t in test_sents[0]]
predicted = viterbi(test_sentence)

print("Sentence:", ' '.join(test_sentence))

print("\nWord            Predicted   True")
correct = 0
for (w, pt), tt in zip(predicted, true_tags):
    print(f"{w:15} {pt:10}  {tt}")
    if pt == tt:
        correct += 1

print(f"\nAccuracy on this sentence: {correct}/{len(true_tags)} = {correct / len(true_tags) * 100:.2f}%")
