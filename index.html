Program 1: Perceptron Model for Binary Classification
=====================================================

Aim
---
To implement a perceptron model from scratch for binary classification and demonstrate how a single-layer neural network learns to separate linearly separable data.

Procedure
---------
1. Import necessary libraries: numpy for computation, matplotlib for plotting.
2. Define the Perceptron class with weight initialization, predict(), and train() methods.
3. Generate or use a simple binary classification dataset (e.g., AND gate or linearly separable points).
4. Initialize perceptron with learning rate and number of epochs.
5. Train the model using the perceptron learning rule: w = w + lr * (y - y_hat) * x.
6. Track misclassification errors per epoch.
7. Plot the decision boundary and training error convergence.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {'numpy': 'numpy', 'matplotlib': 'matplotlib'}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

import numpy as np
import matplotlib.pyplot as plt

class Perceptron:
    def __init__(self, learning_rate=0.1, n_epochs=100):
        self.lr = learning_rate
        self.n_epochs = n_epochs
        self.weights = None
        self.bias = None
        self.errors = []

    def step_function(self, x):
        return np.where(x >= 0, 1, 0)

    def train(self, X, y):
        n_samples, n_features = X.shape
        self.weights = np.zeros(n_features)
        self.bias = 0
        for epoch in range(self.n_epochs):
            error_count = 0
            for xi, yi in zip(X, y):
                output = self.step_function(np.dot(xi, self.weights) + self.bias)
                update = self.lr * (yi - output)
                self.weights += update * xi
                self.bias += update
                error_count += int(update != 0)
            self.errors.append(error_count)

    def predict(self, X):
        return self.step_function(np.dot(X, self.weights) + self.bias)

# Dataset: OR gate
X = np.array([[0,0],[0,1],[1,0],[1,1]])
y = np.array([0, 1, 1, 1])

p = Perceptron(learning_rate=0.1, n_epochs=20)
p.train(X, y)
predictions = p.predict(X)

print('Weights:', p.weights)
print('Bias:', p.bias)
print('Predictions:', predictions)
print('Accuracy: {:.2f}%'.format(np.mean(predictions == y) * 100))

plt.plot(range(1, len(p.errors)+1), p.errors, marker='o')
plt.xlabel('Epoch'); plt.ylabel('Misclassifications')
plt.title('Perceptron Training Error')
plt.show()

Program 3: Activation Functions (ReLU, Sigmoid, Tanh)
=====================================================

Aim
---
To implement and visualize three major activation functions - ReLU, Sigmoid, and Tanh - and analyze their mathematical properties, gradients, and typical use cases in neural networks.

Procedure
---------
1. Import numpy and matplotlib libraries.
2. Define input range x from -10 to 10.
3. Implement Sigmoid: f(x) = 1 / (1 + e^-x).
4. Implement Tanh: f(x) = (e^x - e^-x) / (e^x + e^-x).
5. Implement ReLU: f(x) = max(0, x).
6. Compute derivatives of each activation function.
7. Plot all functions and their derivatives in a 2x3 subplot grid.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {'numpy': 'numpy', 'matplotlib': 'matplotlib'}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

import numpy as np
import matplotlib.pyplot as plt

x = np.linspace(-10, 10, 300)

# Activation functions
def sigmoid(x): return 1 / (1 + np.exp(-x))
def sigmoid_deriv(x): s = sigmoid(x); return s * (1 - s)

def tanh(x): return np.tanh(x)
def tanh_deriv(x): return 1 - np.tanh(x)**2

def relu(x): return np.maximum(0, x)
def relu_deriv(x): return np.where(x > 0, 1, 0)

# Plot
fig, axes = plt.subplots(2, 3, figsize=(15, 8))
funcs = [(sigmoid, sigmoid_deriv, 'Sigmoid', 'blue'),
         (tanh, tanh_deriv, 'Tanh', 'green'),
         (relu, relu_deriv, 'ReLU', 'red')]

for i, (fn, dfn, name, color) in enumerate(funcs):
    axes[0, i].plot(x, fn(x), color=color, linewidth=2)
    axes[0, i].set_title(f'{name} Function'); axes[0, i].grid(True)
    axes[1, i].plot(x, dfn(x), color=color, linestyle='--', linewidth=2)
    axes[1, i].set_title(f'{name} Derivative'); axes[1, i].grid(True)

plt.tight_layout()
plt.show()

# Print key values
for fn, name in [(sigmoid, 'Sigmoid'), (tanh, 'Tanh'), (relu, 'ReLU')]:
    print(f'{name}: f(0)={fn(np.array([0]))[0]:.4f}, f(2)={fn(np.array([2]))[0]:.4f}, f(-2)={fn(np.array([-2]))[0]:.4f}')



Program 4: Backpropagation for Neural Network Training
======================================================

Aim
---
To implement backpropagation from scratch for training a simple feedforward neural network and analyze the behavior of the loss function during training.

Procedure
---------
1. Define neural network architecture with one hidden layer.
2. Initialize weights and biases randomly using numpy.
3. Implement forward pass: compute activations at each layer.
4. Define Mean Squared Error (MSE) loss function.
5. Implement backward pass: compute gradients using chain rule.
6. Update weights with gradient descent.
7. Train on XOR problem and plot loss curve over epochs.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {'numpy': 'numpy', 'matplotlib': 'matplotlib'}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

import numpy as np
import matplotlib.pyplot as plt

# Sigmoid and its derivative
def sigmoid(x): return 1 / (1 + np.exp(-x))
def sigmoid_d(x): return sigmoid(x) * (1 - sigmoid(x))

# XOR dataset
X = np.array([[0,0],[0,1],[1,0],[1,1]])
y = np.array([[0],[1],[1],[0]])

np.random.seed(42)
W1 = np.random.randn(2, 4) * 0.5
b1 = np.zeros((1, 4))
W2 = np.random.randn(4, 1) * 0.5
b2 = np.zeros((1, 1))
lr = 0.5; losses = []

for epoch in range(10000):
    # Forward pass
    z1 = X @ W1 + b1
    a1 = sigmoid(z1)
    z2 = a1 @ W2 + b2
    a2 = sigmoid(z2)

    # Loss
    loss = np.mean((y - a2) ** 2)
    losses.append(loss)

    # Backward pass
    d_a2 = -2*(y - a2)/y.shape[0]
    d_z2 = d_a2 * sigmoid_d(z2)
    dW2 = a1.T @ d_z2
    db2 = np.sum(d_z2, axis=0, keepdims=True)
    d_a1 = d_z2 @ W2.T
    d_z1 = d_a1 * sigmoid_d(z1)
    dW1 = X.T @ d_z1
    db1 = np.sum(d_z1, axis=0, keepdims=True)

    # Update weights
    W2 -= lr * dW2; b2 -= lr * db2
    W1 -= lr * dW1; b1 -= lr * db1

    if epoch % 1000 == 0:
        print(f'Epoch {epoch}: Loss={loss:.6f}')

print('Predictions:', np.round(a2.T, 3))
plt.plot(losses); plt.title('Loss Curve')
plt.show()



Program 5: CNN Model for Image Classification
=============================================

Aim
---
To train a Convolutional Neural Network (CNN) model for image classification on the CIFAR-10 dataset and evaluate its performance in terms of accuracy and loss.

import tensorflow as tf
from tensorflow.keras import layers, models
import matplotlib.pyplot as plt
import numpy as np

# Load CIFAR-10
(X_train, y_train), (X_test, y_test) = tf.keras.datasets.cifar10.load_data()
X_train, X_test = X_train/255.0, X_test/255.0
classes = ['airplane','auto','bird','cat','deer','dog','frog','horse','ship','truck']

# Build CNN

    layers.Conv2D(32, (3,3), activation='relu', input_shape=(32,32,3)),
    layers.MaxPooling2D(2,2),
    layers.Conv2D(64, (3,3), activation='relu'),

Program 6: Overfitting and Underfitting with Regularization
===========================================================

Aim
---
To analyze overfitting and underfitting in deep learning models and apply regularization techniques (L1/L2, Dropout, Early Stopping) to achieve better generalization.

Procedure
---------
1. Load dataset and create three models: underfitting (too simple), overfitting (no regularization), regularized.
2. Underfitting model: Single dense layer with few neurons.
3. Overfitting model: Deep network trained too long without regularization.
4. Regularized model: Add Dropout (0.5), L2 weight decay, and Early Stopping.
5. Train all three models and plot training vs validation accuracy curves.
6. Compare test accuracies to demonstrate effectiveness of regularization.
7. Visualize the gap between train/val loss for each model.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {'tensorflow': 'tensorflow', 'matplotlib': 'matplotlib', 'numpy': 'numpy'}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

import tensorflow as tf
from tensorflow.keras import layers, models, regularizers, callbacks
import matplotlib.pyplot as plt
import numpy as np

(X_train, y_train), (X_test, y_test) = tf.keras.datasets.mnist.load_data()
X_train = X_train.reshape(-1, 784)/255.0
X_test  = X_test.reshape(-1, 784)/255.0
# Use only 2000 samples to exaggerate overfitting
X_small, y_small = X_train[:2000], y_train[:2000]

def make_model(kind='overfit'):
    m = models.Sequential()
    if kind == 'underfit':
        m.add(layers.Dense(4, activation='relu', input_shape=(784,)))
    elif kind == 'overfit':
        for _ in range(5): m.add(layers.Dense(512, activation='relu'))
    else:  # regularized
        for _ in range(5):
            m.add(layers.Dense(512, activation='relu',
                  kernel_regularizer=regularizers.l2(0.001)))
            m.add(layers.Dropout(0.5))
    m.add(layers.Dense(10, activation='softmax'))
    m.compile(optimizer='adam', loss='sparse_categorical_crossentropy', metrics=['accuracy'])
    return m

histories = {}
early_stop = callbacks.EarlyStopping(patience=5, restore_best_weights=True)
for kind in ['underfit', 'overfit', 'regularized']:
    cb = [early_stop] if kind == 'regularized' else []
    h = make_model(kind).fit(X_small, y_small, epochs=50,
                             validation_split=0.2, verbose=0, callbacks=cb)
    histories[kind] = h.history
    train_acc = h.history["accuracy"][-1]
    val_acc = max(h.history["val_accuracy"])
    print(f'{kind}: train_acc={train_acc:.4f}, val_acc={val_acc:.4f}, gap={train_acc - val_acc:.4f}')

# Plot training vs validation accuracy for each model
fig, axes = plt.subplots(1, 3, figsize=(15, 4))
for ax, kind in zip(axes, ['underfit', 'overfit', 'regularized']):
    ax.plot(histories[kind]['accuracy'], label='Train')
    ax.plot(histories[kind]['val_accuracy'], label='Val')
    ax.set_title(kind); ax.set_xlabel('Epoch'); ax.set_ylabel('Accuracy'); ax.legend()
plt.tight_layout()
plt.show()
