<!--
Program 4: Apply classification or clustering techniques to solve a data driven problem and analyze the outcomes
================================================================================================================

Aim
---
To apply K-Means clustering on the Mall Customers dataset to segment customers based on income and spending score, and analyze the resulting clusters.

Dataset: Mall_Customers.csv (place it in the same folder as the notebook)

Procedure
---------
1. Import pandas, numpy, matplotlib, seaborn and scikit-learn modules.
2. Load the Mall_Customers.csv dataset.
3. Check missing values and duplicates.
4. Select Annual Income and Spending Score as clustering features.
5. Scale the features using StandardScaler.
6. Use the Elbow Method to find the optimal number of clusters.
7. Apply K-Means clustering with K = 5.
8. Visualize the clusters and centroids on a scatter plot.
9. Analyze cluster-wise averages and customer counts per cluster.
10. Evaluate clustering quality using the Silhouette Score.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {'pandas': 'pandas', 'numpy': 'numpy', 'matplotlib': 'matplotlib', 'seaborn': 'seaborn', 'sklearn': 'scikit-learn'}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

import pandas as pd
import numpy as np
import matplotlib.pyplot as plt
import seaborn as sns

from sklearn.cluster import KMeans
from sklearn.preprocessing import StandardScaler
from sklearn.metrics import silhouette_score

sns.set_style("whitegrid")

# Load dataset
df = pd.read_csv("Mall_Customers.csv")
display(df.head())

print("Shape:", df.shape)
print("\nMissing values:\n", df.isnull().sum())
print("Duplicate rows:", df.duplicated().sum())

display(df.describe())

# Select features for clustering
X = df[["Annual Income (k$)", "Spending Score (1-100)"]]
display(X.head())

# Scale features
scaler = StandardScaler()
X_scaled = scaler.fit_transform(X)

# Elbow method to find optimal number of clusters
wcss = []
for i in range(1, 11):
    kmeans = KMeans(n_clusters=i, random_state=42, n_init=10)
    kmeans.fit(X_scaled)
    wcss.append(kmeans.inertia_)

plt.figure(figsize=(8, 5))
plt.plot(range(1, 11), wcss, marker="o")
plt.xlabel("Number of Clusters (K)")
plt.ylabel("WCSS")
plt.title("Elbow Method")
plt.show()

# Apply K-Means with K = 5
kmeans = KMeans(n_clusters=5, random_state=42, n_init=10)
df["Cluster"] = kmeans.fit_predict(X_scaled)
display(df.head())

# Visualize the clusters
centers = scaler.inverse_transform(kmeans.cluster_centers_)

plt.figure(figsize=(9, 7))
sns.scatterplot(data=df, x="Annual Income (k$)", y="Spending Score (1-100)", hue="Cluster", palette="Set1", s=100)
plt.scatter(centers[:, 0], centers[:, 1], color="black", marker="X", s=200, label="Centroids")
plt.title("Customer Segments (K-Means Clustering)")
plt.legend()
plt.show()

# Cluster-wise summary
cluster_summary = df.groupby("Cluster")[["Age", "Annual Income (k$)", "Spending Score (1-100)"]].mean()
print(cluster_summary)

# Number of customers per cluster
cluster_counts = df["Cluster"].value_counts().sort_index()
plt.figure(figsize=(7, 5))
cluster_counts.plot(kind="bar")
plt.title("Number of Customers in Each Cluster")
plt.xlabel("Cluster")
plt.ylabel("Count")
plt.xticks(rotation=0)
plt.show()

# Evaluate clustering using Silhouette Score
score = silhouette_score(X_scaled, df["Cluster"])
print("Silhouette Score:", round(score, 3))
