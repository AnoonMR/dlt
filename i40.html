<!--
Program 4: Noisy Channel Model for Spelling Correction
======================================================

Aim
---
To implement a spelling correction system based on the Noisy Channel Model using edit distance and word frequency.

Procedure
---------
1. Build word frequencies from a corpus (language model).
2. Generate candidate words within edit distance 1-2 (channel model).
3. Keep only valid dictionary candidates.
4. Pick the candidate with highest P(word).
5. Test on misspelled words and display corrections.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {'nltk': 'nltk'}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

import nltk
nltk.download('brown')

from collections import Counter
from nltk.corpus import brown

# Language model: real word-frequency counts built from the Brown corpus
# (a plain word list like nltk.corpus.words has no frequency info, so
# using a running-text corpus gives far better corrections)
WORDS = Counter(w.lower() for w in brown.words())


def P(word, N=sum(WORDS.values())):
    """Probability of `word` (language model term of the noisy channel)."""
    return WORDS[word] / N


def edits1(word):
    """All strings that are one edit away from `word` (channel model)."""
    letters = 'abcdefghijklmnopqrstuvwxyz'
    splits = [(word[:i], word[i:]) for i in range(len(word) + 1)]
    deletes = [L + R[1:] for L, R in splits if R]
    transposes = [L + R[1] + R[0] + R[2:] for L, R in splits if len(R) > 1]
    replaces = [L + c + R[1:] for L, R in splits if R for c in letters]
    inserts = [L + c + R for L, R in splits for c in letters]
    return set(deletes + transposes + replaces + inserts)


def edits2(word):
    """All strings that are two edits away from `word`."""
    return set(e2 for e1 in edits1(word) for e2 in edits1(e1))


def known(word_list):
    """Subset of `word_list` that appear in the dictionary."""
    return set(w for w in word_list if w in WORDS)


def candidates(word):
    """Generate possible spelling correction candidates for word."""
    return known([word]) or known(edits1(word)) or known(edits2(word)) or [word]


def correction(word):
    """Most probable spelling correction for word (argmax P(word) among candidates)."""
    return max(candidates(word), key=P)


test_words = ["speling", "korrect", "recieve", "wrld"]
for w in test_words:
    print(f"'{w}' -> '{correction(w)}'")
