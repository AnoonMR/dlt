<!--
Program 1: Introduction to NLP Libraries (NLTK, SpaCy)
======================================================

Aim
---
To explore basic NLP libraries NLTK and spaCy by performing tokenization, POS tagging, and named entity recognition.

Procedure
---------
1. Install and import the NLTK and spaCy libraries.
2. Download required NLTK data (punkt, tagger, chunker, wordnet).
3. Load spaCy's English model (en_core_web_sm).
4. Take a sample sentence as input.
5. Tokenize the sentence using NLTK and spaCy.
6. Perform POS tagging using both libraries.
7. Perform Named Entity Recognition using both libraries.
8. Compare and display the outputs.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {'nltk': 'nltk', 'spacy': 'spacy'}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

import spacy
try:
    spacy.load("en_core_web_sm")
except OSError:
    subprocess.check_call([sys.executable, "-m", "spacy", "download", "en_core_web_sm"])

import nltk
nltk.download('punkt')
nltk.download('punkt_tab')
nltk.download('averaged_perceptron_tagger')
nltk.download('averaged_perceptron_tagger_eng')
nltk.download('maxent_ne_chunker')
nltk.download('maxent_ne_chunker_tab')
nltk.download('words')
nltk.download('stopwords')
nltk.download('wordnet')
nltk.download('brown')

import nltk
import spacy

nlp = spacy.load("en_core_web_sm")

text = "Apple is looking at buying a U.K. startup for $1 billion."

# ---- NLTK ----
print("NLTK Word Tokenization:")
print(nltk.word_tokenize(text))

print("\nNLTK POS Tagging:")
print(nltk.pos_tag(nltk.word_tokenize(text)))

print("\nNLTK Named Entity Recognition:")
tree = nltk.ne_chunk(nltk.pos_tag(nltk.word_tokenize(text)))
print(tree)

# ---- spaCy ----
doc = nlp(text)
print("\nspaCy Tokenization:")
print([token.text for token in doc])

print("\nspaCy POS Tagging:")
print([(token.text, token.pos_) for token in doc])

print("\nspaCy Named Entity Recognition:")
print([(ent.text, ent.label_) for ent in doc.ents])
