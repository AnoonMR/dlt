<!--
Program 1: Perform data cleaning and preprocessing on a dataset containing missing values and outliers
======================================================================================================

Aim
---
To clean and preprocess the Penguins dataset by handling missing values and detecting/treating outliers using the IQR method.

Dataset: penguins_size.csv (place it in the same folder as the notebook)

Procedure
---------
1. Import pandas, numpy, matplotlib and seaborn.
2. Load the penguins_size.csv dataset.
3. Check dataset shape, info and missing values.
4. Replace invalid entries (e.g. '.') with NaN.
5. Fill missing numeric values with median and categorical values with mode.
6. Drop duplicate rows.
7. Detect outliers in numeric columns using the IQR method.
8. Plot boxplots before treatment to visualize outliers.
9. Cap outliers to the IQR lower/upper bounds (winsorizing).
10. Plot boxplots after treatment and save the cleaned dataset.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {'pandas': 'pandas', 'numpy': 'numpy', 'matplotlib': 'matplotlib', 'seaborn': 'seaborn'}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

import pandas as pd
import numpy as np
import matplotlib.pyplot as plt
import seaborn as sns

sns.set_style("whitegrid")

# Load dataset
df = pd.read_csv("penguins_size.csv")
display(df.head())

# Basic info
print("Shape:", df.shape)
print(df.info())

# Check missing values
print("Missing values per column:")
print(df.isnull().sum())

# '.' is an invalid entry hiding in the sex column, treat it as missing
df['sex'] = df['sex'].replace('.', np.nan)
print(df['sex'].unique())

# Handle missing values: numeric columns -> median, categorical -> mode
num_cols = df.select_dtypes(include=np.number).columns
cat_cols = df.select_dtypes(exclude=np.number).columns

for col in num_cols:
    df[col] = df[col].fillna(df[col].median())

for col in cat_cols:
    df[col] = df[col].fillna(df[col].mode()[0])

print("Missing values after cleaning:")
print(df.isnull().sum())

# Check for duplicate rows
print("Duplicate rows:", df.duplicated().sum())
df = df.drop_duplicates()

# Outlier detection using IQR method
def iqr_bounds(series):
    q1 = series.quantile(0.25)
    q3 = series.quantile(0.75)
    iqr = q3 - q1
    return q1 - 1.5 * iqr, q3 + 1.5 * iqr

for col in num_cols:
    lower, upper = iqr_bounds(df[col])
    outliers = df[(df[col] < lower) | (df[col] > upper)]
    print(f"{col}: {len(outliers)} outliers (bounds: {lower:.2f}, {upper:.2f})")

# Boxplots before outlier treatment
fig, axes = plt.subplots(1, len(num_cols), figsize=(4*len(num_cols), 4))
for ax, col in zip(axes, num_cols):
    sns.boxplot(y=df[col], ax=ax)
    ax.set_title(col)
plt.tight_layout()
plt.show()

# Treat outliers by capping to IQR bounds (winsorizing)
for col in num_cols:
    lower, upper = iqr_bounds(df[col])
    df[col] = np.clip(df[col], lower, upper)

# Boxplots after outlier treatment
fig, axes = plt.subplots(1, len(num_cols), figsize=(4*len(num_cols), 4))
for ax, col in zip(axes, num_cols):
    sns.boxplot(y=df[col], ax=ax)
    ax.set_title(col)
plt.tight_layout()
plt.show()

# Final cleaned dataset
print(df.describe())
df.to_csv("penguins_cleaned.csv", index=False)
print("\nCleaned dataset saved as penguins_cleaned.csv")
