<!--
Program 3: Implementing Edit Distance and Weighted Edit Distance
================================================================

Aim
---
To compute the Edit Distance and Weighted Edit Distance between two given strings using dynamic programming.

Procedure
---------
1. Take two input strings/words.
2. Create a DP table of size (m+1) x (n+1).
3. Initialize first row and column with index values (base costs).
4. Fill the table: if characters match, copy diagonal value.
5. If characters differ, take min of insert, delete, substitute
6. operations (+1 each for simple edit distance).
7. For weighted edit distance, use custom costs for insertion,
8. deletion, and substitution instead of uniform cost 1.
9. Return the value in the last cell as the edit distance.
10. Display both simple and weighted edit distance results.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

def edit_distance(s1, s2):
    """Levenshtein (unweighted) edit distance using dynamic programming."""
    m, n = len(s1), len(s2)
    dp = [[0] * (n + 1) for _ in range(m + 1)]

    for i in range(m + 1):
        dp[i][0] = i
    for j in range(n + 1):
        dp[0][j] = j

    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if s1[i - 1] == s2[j - 1]:
                dp[i][j] = dp[i - 1][j - 1]
            else:
                dp[i][j] = 1 + min(dp[i - 1][j],      # deletion
                                    dp[i][j - 1],      # insertion
                                    dp[i - 1][j - 1])  # substitution
    return dp[m][n]


def weighted_edit_distance(s1, s2, ins_cost=1, del_cost=1, sub_cost=2):
    """Edit distance with custom insertion/deletion/substitution costs."""
    m, n = len(s1), len(s2)
    dp = [[0] * (n + 1) for _ in range(m + 1)]

    for i in range(m + 1):
        dp[i][0] = i * del_cost
    for j in range(n + 1):
        dp[0][j] = j * ins_cost

    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if s1[i - 1] == s2[j - 1]:
                dp[i][j] = dp[i - 1][j - 1]
            else:
                dp[i][j] = min(dp[i - 1][j] + del_cost,
                                dp[i][j - 1] + ins_cost,
                                dp[i - 1][j - 1] + sub_cost)
    return dp[m][n]


word1, word2 = "intention", "execution"
print(f"Edit Distance between '{word1}' and '{word2}': {edit_distance(word1, word2)}")
print(f"Weighted Edit Distance between '{word1}' and '{word2}': "
      f"{weighted_edit_distance(word1, word2)}")
