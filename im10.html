===============================================================

Aim
---
To explore the NLTK library by performing tokenization, POS tagging, and named entity recognition.

Code
----
# --- Auto-install required packages (safe to re-run; skips what's already installed) ---
import importlib, subprocess, sys

required = {'nltk': 'nltk'}
for import_name, pip_name in required.items():
    try:
        importlib.import_module(import_name)
    except ImportError:
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", pip_name])

import nltk
for pkg in ['punkt', 'punkt_tab', 'averaged_perceptron_tagger', 'averaged_perceptron_tagger_eng', 'maxent_ne_chunker', 'maxent_ne_chunker_tab', 'words']:
    nltk.download(pkg)

import nltk

text = "Apple is looking at buying a U.K. startup for $1 billion. Tim Cook announced it in London."

sentences = nltk.sent_tokenize(text)
tokens = nltk.word_tokenize(text)
tags = nltk.pos_tag(tokens)

print("Sentences:", sentences)
print("Word tokens:", tokens)
print("\nPOS Tags:")
for word, tag in tags:
    print(f"  {word:10s} {tag}")

tree = nltk.ne_chunk(tags)
print("\nNamed Entities:")
for subtree in tree:
    if hasattr(subtree, 'label'):
        entity = ' '.join(w for w, t in subtree.leaves())
        print(f"  {entity:15s} {subtree.label()}")
